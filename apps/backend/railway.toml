[build]
buildCommand = "cd apps/backend && npx medusa build"

[deploy]
preDeployCommand = "cd apps/backend && npx medusa db:migrate && (npx medusa exec ./src/scripts/eawb-setup.ts || true) && (npx medusa exec ./src/scripts/eawb-check.ts || true)"
startCommand = "cd apps/backend/.medusa/server && npx medusa start"
